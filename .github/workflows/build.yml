name: Build NeuroMicrophone

# Позволяет получить настоящий, скомпилированный .exe без установки Visual
# Studio на своём компьютере — GitHub бесплатно предоставляет для этого
# реальную виртуальную машину с Windows.
#
# Версия сборки: 1.0.<номер запуска workflow> — монотонно растёт с каждым
# запуском, поэтому каждая успешная сборка публикуется как ОТДЕЛЬНЫЙ релиз
# с уникальным тегом (а не перезаписывает один и тот же "latest"). Это даёт
# полноценную историю версий: можно открыть вкладку Releases и откатиться
# на любую конкретную рабочую сборку, если новая окажется хуже. GitHub сам
# считает самый последний созданный релиз "latest" (без каких-либо
# дополнительных действий) — именно его читает и UpdateCheckService внутри
# приложения через /releases/latest.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup MSYS2 (MinGW-w64 toolchain, for building RNNoise)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            wget
            autoconf
            automake
            libtool
            mingw-w64-x86_64-toolchain

      # Раньше rnnoise.dll нужно было собирать вручную (см. README.md) и
      # класть в src/native/ — если этого не сделать, автосборка через этот
      # workflow всё равно проходила успешно, но БЕЗ реального шумоподавления
      # (RnnoiseDenoiser корректно деградирует до "сигнал как есть", ничего
      # не падает — но и не подавляет шум). Этот шаг собирает rnnoise.dll
      # прямо здесь, кросс-компиляцией под Windows x64 через MinGW-w64, из
      # официального репозитория проекта — так каждая автосборка честно
      # включает шумоподавление, без ручных действий.
      - name: Build RNNoise (rnnoise.dll)
        shell: msys2 {0}
        run: |
          set -e
          git clone --depth 1 https://github.com/xiph/rnnoise.git /tmp/rnnoise-src
          cd /tmp/rnnoise-src

          # autogen.sh сам вызывает download_model.sh (обученные веса не
          # хранятся в git-репозитории rnnoise) и затем прогоняет autoreconf.
          ./autogen.sh

          if [ ! -f src/rnnoise_data.c ]; then
            echo "::error::download_model.sh (внутри autogen.sh) не создал src/rnnoise_data.c — сборка RNNoise невозможна."
            exit 1
          fi

          ./configure --host=x86_64-w64-mingw32 --disable-examples
          make -j"$(nproc)"

          # Точное имя итоговой DLL зависит от libtool version-info текущей
          # версии rnnoise — вместо того чтобы жёстко зашивать имя (сегодня
          # это librnnoise-0.dll), находим то, что реально собралось, в
          # .libs (стандартная папка выходных файлов libtool).
          DLL_PATH=$(find .libs -maxdepth 1 -iname "*.dll" | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "::error::libtool не создал ни одной .dll в .libs — сборка RNNoise не удалась."
            exit 1
          fi

          WORKSPACE_UNIX=$(cygpath -u "$GITHUB_WORKSPACE")
          mkdir -p "$WORKSPACE_UNIX/src/native"
          cp "$DLL_PATH" "$WORKSPACE_UNIX/src/native/rnnoise.dll"
          echo "RNNoise собран: $DLL_PATH -> src/native/rnnoise.dll"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore src/NeuroMicrophone.csproj 2>&1 | Tee-Object -FilePath restore-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        run: |
          dotnet test tests/NeuroMicrophone.Tests/NeuroMicrophone.Tests.csproj --configuration Release 2>&1 | Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish application
        run: |
          dotnet publish src/NeuroMicrophone.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.version }} 2>&1 | Tee-Object -FilePath publish-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload application (unpacked folder)
        uses: actions/upload-artifact@v4
        with:
          name: NeuroMicrophone-app
          path: src/bin/Release/net8.0-windows/win-x64/publish/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" "Installer\setup_script.iss" 2>&1 | Tee-Object -FilePath installer-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Раньше этот шаг был помечен continue-on-error: true — если ISCC.exe
          # падал по любой причине, workflow всё равно показывал зелёную
          # галочку и публиковал релиз, только без .exe-установщика (только
          # архив с файлами приложения). Смысл всего пайплайна — "всегда
          # получать готовый установщик", поэтому теперь при реальном сбое
          # (в том числе если ISCC.exe вернул 0, но по какой-то причине не
          # создал файл) весь workflow явно и видимо падает, вместо того
          # чтобы молча выпустить неполный релиз.
          if (-not (Test-Path "Installer\Output\NeuroMicrophone_Setup.exe")) {
            Write-Error "ISCC.exe завершился успешно, но NeuroMicrophone_Setup.exe не найден."
            exit 1
          }

      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: NeuroMicrophone-Setup
          path: Installer\Output\NeuroMicrophone_Setup.exe
          if-no-files-found: warn

      - name: Package release assets
        if: success()
        shell: pwsh
        run: |
          Compress-Archive -Path 'src\bin\Release\net8.0-windows\win-x64\publish\*' -DestinationPath 'NeuroMicrophone-app.zip'

      # Артефакты actions/upload-artifact скачиваются через Azure Blob Storage,
      # к которому нет доступа из некоторых сетевых окружений. GitHub Release
      # раздаёт файлы напрямую с github.com — надёжный запасной путь получить
      # реальный собранный файл. Каждый успешный билд — отдельный тег vX.Y.Z,
      # без удаления/перезаписи предыдущих релизов.
      - name: Publish GitHub Release with build results
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(NeuroMicrophone-app.zip)
          if [ -f "Installer/Output/NeuroMicrophone_Setup.exe" ]; then
            ASSETS+=(Installer/Output/NeuroMicrophone_Setup.exe)
          fi
          gh release create "v${{ steps.version.outputs.version }}" "${ASSETS[@]}" \
            --title "NeuroMicrophone v${{ steps.version.outputs.version }}" \
            --notes "Автоматическая сборка из workflow. Коммит: ${GITHUB_SHA}" \
            --repo "${{ github.repository }}"

      # Логи публикуются через отдельную ветку в самом git-репозитории —
      # так их можно получить обычным `git fetch`, без обращения к
      # Azure Blob Storage, где хранятся полные логи Actions. Работа ведётся
      # в отдельном временном клоне, а не в рабочей директории джоба, чтобы
      # оставшиеся после сборки файлы (bin/, obj/, *-output.txt) не мешали
      # переключению веток.
      - name: Publish CI logs (always, for diagnostics)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci-output
          for f in restore-output.txt test-output.txt publish-output.txt installer-output.txt; do
            if [ -f "$f" ]; then cp "$f" /tmp/ci-output/; fi
          done
          echo "job_status=${{ job.status }}" > /tmp/ci-output/summary.txt
          echo "commit=${GITHUB_SHA}" >> /tmp/ci-output/summary.txt
          echo "version=${{ steps.version.outputs.version }}" >> /tmp/ci-output/summary.txt

          rm -rf /tmp/ci-results-repo
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch ci-results "$REPO_URL" /tmp/ci-results-repo 2>/dev/null \
            || git clone --depth 1 "$REPO_URL" /tmp/ci-results-repo

          cd /tmp/ci-results-repo
          git config user.email "ci@neuromicrophone.local"
          git config user.name "NeuroMicrophone CI"
          git checkout --orphan ci-results-new
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/ci-output/*.txt .
          git add -A
          git commit -m "CI output for ${GITHUB_SHA}"
          git branch -D ci-results 2>/dev/null || true
          git branch -m ci-results-new ci-results
          git push origin ci-results --force
